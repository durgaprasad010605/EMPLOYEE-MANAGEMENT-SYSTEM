# =====================================================================
# EMPLOYEE TRACKER BACKEND CONFIGURATION TEMPLATE
# =====================================================================
# Copy this file to 'application-local.properties' or configure environment
# variables directly in your deployment environment.
# =====================================================================

spring.application.name=employee-tracker-backend
server.port=${SERVER_PORT:8080}

# Database Configuration
# Provide DB_URL, DB_USERNAME, and DB_PASSWORD via environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Provide 256-bit Hex Key via JWT_SECRET environment variable)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.employeetracker=INFO
logging.level.org.springframework.security=WARN
