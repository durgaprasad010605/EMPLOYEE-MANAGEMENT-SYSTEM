spring.application.name=employee-tracker-backend
server.port=${SERVER_PORT:8080}

# Database Configuration (supports DB_URL, DB_USERNAME, DB_PASSWORD environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rdp1971}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (supports JWT_SECRET and JWT_EXPIRATION_MS environment variables)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.employeetracker=INFO
logging.level.org.springframework.security=WARN
